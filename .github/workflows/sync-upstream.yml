name: Sync master with upstream Nightscout

# Keeps this fork's master branch identical to nightscout/cgm-remote-monitor.
# When master advances, Render (watching master) auto-deploys the new version.
on:
  schedule:
    - cron: '0 5 * * *'   # daily at 05:00 UTC
  workflow_dispatch:        # allows a manual run from the Actions tab

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fast-forward master to upstream
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          before=$(gh api "repos/${{ github.repository }}/commits/master" --jq '.sha')
          echo "master before: $before"
          gh api -X POST "repos/${{ github.repository }}/merge-upstream" -f branch=master
          after=$(gh api "repos/${{ github.repository }}/commits/master" --jq '.sha')
          echo "master after:  $after"
          if [ "$before" != "$after" ]; then
            ver=$(gh api "repos/${{ github.repository }}/contents/package.json?ref=master" --jq '.content' | base64 -d | jq -r .version)
            echo "Updated to version $ver"
            echo "updated=true" >> "$GITHUB_OUTPUT"
            echo "version=$ver" >> "$GITHUB_OUTPUT"
          else
            echo "Already up to date; no new version."
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify on successful update
        if: steps.sync.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver="${{ steps.sync.outputs.version }}"
          url=$(gh issue create --repo "${{ github.repository }}" --title "Nightscout updated to v$ver" --body "master was fast-forwarded to upstream and is now v$ver. Render is auto-deploying it to https://nightscout-vzae.onrender.com -- this is just a heads-up and is auto-closed. Find past update notices under Closed issues.")
          num="${url##*/}"
          gh issue close "$num" --repo "${{ github.repository }}" || true

      - name: Open an issue if the sync failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Nightscout upstream sync failed"
          existing=$(gh issue list --repo "${{ github.repository }}" --state open --search "$title in:title" --json number --jq 'length')
          if [ "$existing" = "0" ]; then
            gh issue create --repo "${{ github.repository }}" --title "$title" --body "The daily upstream sync failed. Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} -- Your Render site keeps running the last good version; auto-updates are paused until this is fixed. Close this issue once resolved."
          else
            echo "An open failure issue already exists; not creating a duplicate."
          fi
