name: Sync master with upstream Nightscout

# Keeps this fork's master branch identical to nightscout/cgm-remote-monitor.
# When master advances, Render (watching master) auto-deploys the new version.
on:
  schedule:
    - cron: '0 5 * * *'   # daily at 05:00 UTC
  workflow_dispatch:        # allows a manual run from the Actions tab

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fast-forward master to upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fast-forwarding master to upstream nightscout/cgm-remote-monitor..."
          gh api -X POST "repos/${{ github.repository }}/merge-upstream" -f branch=master

      - name: Open an issue if the sync failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Nightscout upstream sync failed"
          existing=$(gh issue list --repo "${{ github.repository }}" --state open --search "$title in:title" --json number --jq 'length')
          if [ "$existing" = "0" ]; then
            gh issue create --repo "${{ github.repository }}" --title "$title" --body "The daily upstream sync failed. Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} -- Your Render site keeps running the last good version; auto-updates are paused until this is fixed. Close this issue once resolved."
          else
            echo "An open failure issue already exists; not creating a duplicate."
          fi
